<label class="vf-dropzone-wrapper">
  <input 
    type="file" 
    class="vf-dropzone-native" 
    [disabled]="isDisabled()"
    (change)="onFileSelected($event)"
    accept="image/*,application/pdf">

  <div class="vf-dropzone-content">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="vf-dropzone-icon">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>
    
    <p class="vf-dropzone-text">
      <strong>Haz click para subir</strong> o arrastra y suelta
    </p>
    <p class="vf-dropzone-hint">PDF, PNG, JPG (Max. 10MB)</p>
  </div>
</label>
