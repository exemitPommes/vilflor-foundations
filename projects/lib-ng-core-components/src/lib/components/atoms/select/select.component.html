<button
    type="button"
    [disabled]="isDisabled()"
    class="vf-select-trigger" 
    [attr.popovertarget]="popoverId" 
    popovertargetaction="toggle">
    <span class="vf-select-value">
        {{ displayText() }}
    </span>

    <span class="vf-select-icon">
        @if (currentValue()) {
            <span class="vf-clear-btn" (click)="clearSelection($event)">✕</span>
        } @else {
            <ng-content select="[vf-select-icon]">▼</ng-content>
        }
    </span>
</button>


<div [id]="popoverId" popover="auto" class="vf-select-dropdown">
    <ng-content></ng-content>
</div>
