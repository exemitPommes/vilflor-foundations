<label class="vf-radio-wrapper">
  <input 
    type="radio" 
    class="vf-radio-native"
    [name]="name()"
    [value]="value()"
    [checked]="isChecked()" 
    [disabled]="isGloballyDisabled()"
    (change)="onToggle()">

  <div class="vf-radio-circle">
    
  </div>

  <div class="vf-radio-label">
    <ng-content></ng-content>
  </div>
</label>
